<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INNOVANTAGE 26 | Escape Room</title>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #07070d;
        --card: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f2f2f7;
        --muted: #9a9ab0;
        --accent: #7c5cff;
        --accent2: #00e5ff;
        
        --ok: #00e676;
        --bad: #ff5252;
    }

    body {
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        overflow-x: hidden;
        position: relative;
    }

    /* animated glow background */
    body::before, body::after {
        content: "";
        position: fixed;
        width: 480px; height: 480px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
        z-index: 0;
        animation: drift 14s ease-in-out infinite alternate;
    }
    body::before { background: var(--accent); top: -140px; left: -120px; }
    body::after  { background: var(--accent2); bottom: -160px; right: -120px; animation-delay: -7s; }

    @keyframes drift {
        from { transform: translate(0, 0); }
        to   { transform: translate(60px, 40px); }
    }

    main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        text-align: center;
    }

    /* ===== Event title ===== */
    .event {
        font-size: clamp(2rem, 9vw, 3rem);
        font-weight: 900;
        letter-spacing: 3px;
        background: linear-gradient(90deg, var(--accent2), var(--accent), #ff4fd8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(124, 92, 255, 0.35);
    }

    .event-sub {
        margin: 6px 0 28px;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 6px;
        text-transform: uppercase;
    }

    /* ===== Card ===== */
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 20px;
        padding: 30px 26px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .card.shake { animation: shake 0.45s; }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-7px); }
        80% { transform: translateX(7px); }
    }

    .lock { font-size: 2.2rem; margin-bottom: 6px; }

    h2 { font-size: 1.5rem; margin-bottom: 6px; }

    .hint { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }

    label {
        display: block;
        text-align: left;
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 1.1rem;
        text-align: center;
        letter-spacing: 3px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #555568; letter-spacing: 1px; }

    input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25);
    }

    input:disabled, button:disabled { opacity: 0.45; cursor: not-allowed; }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(124, 92, 255, 0.45);
    }

    button:active:not(:disabled) { transform: translateY(0); }

    #message {
        min-height: 24px;
        margin-top: 18px;
        font-weight: 600;
    }
    .success { color: var(--ok); }
    .error { color: var(--bad); }

    .attempts {
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--muted);
    }

    footer {
        margin-top: 22px;
        font-size: 0.75rem;
        color: #55556a;
        letter-spacing: 1px;
    }

    /* ===== Win overlay ===== */
    #winOverlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(7, 7, 13, 0.92);
        text-align: center;
        padding: 20px;
    }
    #winOverlay.show { display: flex; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #winOverlay .big { font-size: 4rem; margin-bottom: 10px; }
    #winOverlay h2 {
        font-size: clamp(1.8rem, 7vw, 2.8rem);
        background: linear-gradient(90deg, var(--ok), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    #winOverlay p { color: var(--muted); margin: 10px 0 24px; }
    #winOverlay button { width: auto; padding: 12px 32px; }

    canvas#confetti {
        position: fixed;
        inset: 0;
        z-index: 11;
        pointer-events: none;
    }
</style>
</head>

<body>

<main>
    <h1 class="event">INNOVANTAGE 26</h1>
    <div class="event-sub">Tech Fest</div>

    <div class="card" id="card">
        <div class="lock" id="lockIcon">🔐</div>
        <h2>Escape Room</h2>
        <p class="hint">Enter your Team ID and the 4-digit secret key to break out.</p>

        <label for="teamId">Team ID</label>
        <input type="text" id="teamId" placeholder="e.g. A01" autocomplete="off" maxlength="6">

        <label for="secretKey">Secret Key</label>
        <input type="password" id="secretKey" placeholder="• • • •" inputmode="numeric" maxlength="4" autocomplete="off">

        <button id="escapeBtn" onclick="checkKey()">ESCAPE</button>

        <div id="message"></div>
        <div class="attempts" id="attempts"></div>
    </div>

    <footer>INNOVANTAGE 26 • Escape Room</footer>
</main>

<div id="winOverlay">
    <div class="big">🔓</div>
    <h2>YOU ESCAPED!</h2>
    <p id="winText"></p>
    <button onclick="closeWin()">Close</button>
</div>

<canvas id="confetti"></canvas>

<script>
    // Team ID -> Secret Key (all keys are 4 digits)
    const teams = {
        "A01": "4871",
        "B02": "9136",
        "C03": "2754",
        "D04": "6381",
        "E05": "1049"
    };

    const MAX_ATTEMPTS = 5;
    const LOCK_SECONDS = 30;

    const teamInput = document.getElementById("teamId");
    const keyInput = document.getElementById("secretKey");
    const message = document.getElementById("message");
    const attemptsEl = document.getElementById("attempts");
    const card = document.getElementById("card");
    const btn = document.getElementById("escapeBtn");
    const lockIcon = document.getElementById("lockIcon");

    const failed = {}; // wrong attempts per team

    // digits only in key box
    keyInput.addEventListener("input", () => {
        keyInput.value = keyInput.value.replace(/\D/g, "");
    });

    // Enter key submits
    [teamInput, keyInput].forEach(el =>
        el.addEventListener("keydown", e => { if (e.key === "Enter") checkKey(); })
    );

    function show(text, type) {
        message.textContent = text;
        message.className = type;
    }

    function shake() {
        card.classList.remove("shake");
        void card.offsetWidth; // restart animation
        card.classList.add("shake");
    }

    function lockOut() {
        let left = LOCK_SECONDS;
        btn.disabled = teamInput.disabled = keyInput.disabled = true;
        lockIcon.textContent = "⛔";

        const timer = setInterval(() => {
            show(`Too many wrong tries. Wait ${left}s`, "error");
            left--;
            if (left < 0) {
                clearInterval(timer);
                btn.disabled = teamInput.disabled = keyInput.disabled = false;
                lockIcon.textContent = "🔐";
                failed[teamInput.value.trim().toUpperCase()] = 0;
                attemptsEl.textContent = "";
                show("", "");
            }
        }, 1000);
    }

    function checkKey() {
        const teamId = teamInput.value.trim().toUpperCase();
        const key = keyInput.value.trim();

        if (!teamId || !key) {
            show("⚠️ Enter both Team ID and Key", "error");
            shake();
            return;
        }

        if (!teams[teamId]) {
            show("❌ Invalid Team ID", "error");
            attemptsEl.textContent = "";
            shake();
            return;
        }

        if (teams[teamId] === key) {
            show("", "");
            attemptsEl.textContent = "";
            lockIcon.textContent = "🔓";
            win(teamId);
            return;
        }

        failed[teamId] = (failed[teamId] || 0) + 1;
        const left = MAX_ATTEMPTS - failed[teamId];
        keyInput.value = "";
        keyInput.focus();
        shake();

        if (left <= 0) {
            lockOut();
        } else {
            show("❌ Wrong key! Try again.", "error");
            attemptsEl.textContent = `${left} attempt${left === 1 ? "" : "s"} left`;
        }
    }

    function win(teamId) {
        document.getElementById("winText").textContent =
            `Team ${teamId} cracked the code. Report to the organisers!`;
        document.getElementById("winOverlay").classList.add("show");
        launchConfetti();
    }

    function closeWin() {
        document.getElementById("winOverlay").classList.remove("show");
        stopConfetti();
    }

    /* ===== Confetti ===== */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [], raf = null;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function launchConfetti() {
        const colors = ["#7c5cff", "#00e5ff", "#00e676", "#ff4fd8", "#ffd740"];
        pieces = Array.from({ length: 160 }, () => ({
            x: Math.random() * canvas.width,
            y: -20 - Math.random() * canvas.height * 0.5,
            r: 4 + Math.random() * 6,
            c: colors[Math.floor(Math.random() * colors.length)],
            vy: 2 + Math.random() * 4,
            vx: -2 + Math.random() * 4,
            rot: Math.random() * Math.PI
        }));
        cancelAnimationFrame(raf);
        animate();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += 0.1;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
            ctx.restore();
        });
        pieces = pieces.filter(p => p.y < canvas.height + 20);
        if (pieces.length) raf = requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function stopConfetti() {
        cancelAnimationFrame(raf);
        pieces = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>

</body>
</html>
